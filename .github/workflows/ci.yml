name: CI

on:
    push:
        branches:
            - main
        tags:
            - 'v*.*.*'
    pull_request:
        branches:
            - main

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Quality gates
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write

        env:
            COMPOSE_FILE: docker/compose.yaml
            COMPOSE_ENV_FILE: .env.local

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Prepare environment file
              run: cp .env .env.local

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build PHP image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/php/Dockerfile
                  target: dev
                  load: true
                  tags: ddd-symfony-api-php:dev
                  cache-from: type=gha,scope=php-dev
                  cache-to: type=gha,mode=max,scope=php-dev

            - name: Start services
              run: make up-ci

            - name: Install Composer dependencies
              run: docker compose -f "$COMPOSE_FILE" --env-file "$COMPOSE_ENV_FILE" exec -T php composer install --no-interaction --prefer-dist --no-progress

            - name: Generate ER diagram
              run: docker compose -f "$COMPOSE_FILE" --env-file "$COMPOSE_ENV_FILE" exec -T php bin/console app:generate:er-diagram

            - name: Commit ER diagram
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add docs/er-diagram.md
                  if git diff --staged --quiet; then
                    echo "No changes to ER diagram"
                  else
                    git commit -m "chore: regenerate ER diagram"
                    git push
                  fi

            - name: Generate JWT keypair
              run: |
                  docker compose -f "$COMPOSE_FILE" --env-file "$COMPOSE_ENV_FILE" exec -T php sh -c '
                    set -e
                    mkdir -p config/jwt
                    if [ ! -f config/jwt/private.pem ]; then
                      openssl genrsa -aes256 -passout pass:change_me -out config/jwt/private.pem 4096
                      openssl rsa -pubout -passin pass:change_me -in config/jwt/private.pem -out config/jwt/public.pem
                    fi
                  '

            - name: Warm up Symfony container cache (PHPStan)
              run: docker compose -f "$COMPOSE_FILE" --env-file "$COMPOSE_ENV_FILE" exec -T php bin/console cache:warmup --env=dev --no-debug

            - name: Run quality gates
              run: make ci

    publish-image:
        name: Publish production image
        needs: quality
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Derive image tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha,format=short
                      type=semver,pattern={{version}}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/php/Dockerfile
                  target: prod
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      APP_VERSION=${{ github.sha }}
                  cache-from: type=gha,scope=php-prod
                  cache-to: type=gha,mode=max,scope=php-prod
