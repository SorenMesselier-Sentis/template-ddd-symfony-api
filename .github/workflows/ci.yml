name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Quality gates
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write

        env:
            COMPOSE_FILE: docker/compose.yaml
            COMPOSE_ENV_FILE: .env.local

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Prepare environment file
              run: cp .env .env.local

            - name: Build PHP image
              run: docker compose -f "$COMPOSE_FILE" --env-file "$COMPOSE_ENV_FILE" build php

            - name: Start services
              run: docker compose -f "$COMPOSE_FILE" --env-file "$COMPOSE_ENV_FILE" up -d --wait postgres rabbitmq garage redis php

            - name: Bootstrap Garage (layout, access key, buckets)
              run: make garage-bootstrap

            - name: Install Composer dependencies
              run: docker compose -f "$COMPOSE_FILE" --env-file "$COMPOSE_ENV_FILE" exec -T php composer install --no-interaction --prefer-dist --no-progress

            - name: Generate ER diagram
              run: docker compose -f "$COMPOSE_FILE" --env-file "$COMPOSE_ENV_FILE" exec -T php bin/console app:generate:er-diagram

            - name: Commit ER diagram
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add docs/er-diagram.md
                  if git diff --staged --quiet; then
                    echo "No changes to ER diagram"
                  else
                    git commit -m "chore: regenerate ER diagram"
                    git push
                  fi

            - name: Generate JWT keypair
              run: |
                  docker compose -f "$COMPOSE_FILE" --env-file "$COMPOSE_ENV_FILE" exec -T php sh -c '
                    set -e
                    mkdir -p config/jwt
                    if [ ! -f config/jwt/private.pem ]; then
                      openssl genrsa -aes256 -passout pass:change_me -out config/jwt/private.pem 4096
                      openssl rsa -pubout -passin pass:change_me -in config/jwt/private.pem -out config/jwt/public.pem
                    fi
                  '

            - name: Warm up Symfony container cache (PHPStan)
              run: docker compose -f "$COMPOSE_FILE" --env-file "$COMPOSE_ENV_FILE" exec -T php bin/console cache:warmup --env=dev --no-debug

            - name: Run quality gates
              run: make ci
