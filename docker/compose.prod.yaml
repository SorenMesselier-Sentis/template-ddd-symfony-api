# Single-VM production deployment — see docs/deployment.md.
#
# Standalone on purpose (not an override on top of docker/compose.yaml): the topology diverges
# too much for an overlay to stay readable — a different image source (registry, never built
# locally), no bind-mounted source, no Garage/Mailpit/dev-only exporters, and two extra services
# (scheduler, consumer) that don't exist in the dev compose at all.
#
# Driven by the same .env.local mechanism as dev (see Makefile's DOCKER_COMPOSE_PROD), just with
# production values on the server — no separate secrets file. Postgres/RabbitMQ/Redis are
# self-hosted here, consistent with "single VM"; swap DATABASE_URL for a managed Postgres and
# drop the postgres service if you'd rather not run it yourself (docs/backup-and-restore.md).
services:
    # =========================================================
    # PHP (FrankenPHP) — serves HTTP directly. SERVER_NAME must be a real
    # domain for Caddy to request/renew a Let's Encrypt certificate
    # automatically; ports 80/443 must be reachable from the internet for
    # the ACME challenge (see docker/frankenphp/Caddyfile).
    # =========================================================
    php:
        image: ${DOCKER_IMAGE}:${IMAGE_TAG}
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - caddy_data:/data
            - ../config/jwt:/app/config/jwt:ro
            - ../config/oauth:/app/config/oauth:ro
        environment:
            APP_ENV: prod
            APP_SECRET: ${APP_SECRET}
            DEFAULT_URI: ${DEFAULT_URI}
            APP_FRONTEND_URL: ${APP_FRONTEND_URL}
            CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
            SERVER_NAME: ${SERVER_NAME}
            DATABASE_URL: ${DATABASE_URL}
            RABBITMQ_DSN: ${RABBITMQ_DSN}
            PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
            S3_ENDPOINT: ${S3_ENDPOINT}
            S3_ACCESS_KEY: ${S3_ACCESS_KEY}
            S3_SECRET_KEY: ${S3_SECRET_KEY}
            S3_REGION: ${S3_REGION}
            S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
            S3_USE_SSL: ${S3_USE_SSL}
            MAILER_DSN: ${MAILER_DSN}
            MERCURE_URL: ${MERCURE_URL}
            MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL}
            MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
            SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES}
            SYMFONY_TRUSTED_HEADERS: ${SYMFONY_TRUSTED_HEADERS}
            SENTRY_DSN: ${SENTRY_DSN}
            JWT_SECRET_KEY: ${JWT_SECRET_KEY}
            JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
            JWT_PASSPHRASE: ${JWT_PASSPHRASE}
            OAUTH2_ENCRYPTION_KEY: ${OAUTH2_ENCRYPTION_KEY}
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost/health/live"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    # =========================================================
    # Scheduler worker — outbox relay + daily cleanups (mirrors "make
    # scheduler"). Without this, nothing ever relays the transactional
    # outbox to RabbitMQ.
    # =========================================================
    scheduler:
        image: ${DOCKER_IMAGE}:${IMAGE_TAG}
        restart: unless-stopped
        command: ["php", "bin/console", "messenger:consume", "scheduler_default", "--time-limit=3600", "-vv"]
        volumes:
            - ../config/jwt:/app/config/jwt:ro
            - ../config/oauth:/app/config/oauth:ro
        environment:
            APP_ENV: prod
            APP_SECRET: ${APP_SECRET}
            DEFAULT_URI: ${DEFAULT_URI}
            APP_FRONTEND_URL: ${APP_FRONTEND_URL}
            CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
            DATABASE_URL: ${DATABASE_URL}
            RABBITMQ_DSN: ${RABBITMQ_DSN}
            S3_ENDPOINT: ${S3_ENDPOINT}
            S3_ACCESS_KEY: ${S3_ACCESS_KEY}
            S3_SECRET_KEY: ${S3_SECRET_KEY}
            S3_REGION: ${S3_REGION}
            S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
            S3_USE_SSL: ${S3_USE_SSL}
            MAILER_DSN: ${MAILER_DSN}
            MERCURE_URL: ${MERCURE_URL}
            MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL}
            MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
            SENTRY_DSN: ${SENTRY_DSN}
            JWT_SECRET_KEY: ${JWT_SECRET_KEY}
            JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
            JWT_PASSPHRASE: ${JWT_PASSPHRASE}
            OAUTH2_ENCRYPTION_KEY: ${OAUTH2_ENCRYPTION_KEY}
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy

    # =========================================================
    # Async event consumer (mirrors "make consume"). Without this, domain
    # events relayed to RabbitMQ are never handled — no welcome emails,
    # no in-app notifications, etc.
    # =========================================================
    consumer:
        image: ${DOCKER_IMAGE}:${IMAGE_TAG}
        restart: unless-stopped
        command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "-vv"]
        volumes:
            - ../config/jwt:/app/config/jwt:ro
            - ../config/oauth:/app/config/oauth:ro
        environment:
            APP_ENV: prod
            APP_SECRET: ${APP_SECRET}
            DEFAULT_URI: ${DEFAULT_URI}
            APP_FRONTEND_URL: ${APP_FRONTEND_URL}
            CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
            DATABASE_URL: ${DATABASE_URL}
            RABBITMQ_DSN: ${RABBITMQ_DSN}
            S3_ENDPOINT: ${S3_ENDPOINT}
            S3_ACCESS_KEY: ${S3_ACCESS_KEY}
            S3_SECRET_KEY: ${S3_SECRET_KEY}
            S3_REGION: ${S3_REGION}
            S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
            S3_USE_SSL: ${S3_USE_SSL}
            MAILER_DSN: ${MAILER_DSN}
            MERCURE_URL: ${MERCURE_URL}
            MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL}
            MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
            SENTRY_DSN: ${SENTRY_DSN}
            JWT_SECRET_KEY: ${JWT_SECRET_KEY}
            JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
            JWT_PASSPHRASE: ${JWT_PASSPHRASE}
            OAUTH2_ENCRYPTION_KEY: ${OAUTH2_ENCRYPTION_KEY}
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy

    # =========================================================
    # Outbound webhook delivery worker (mirrors "make webhook-consumer").
    # Its own service/process, not folded into "consumer" above, so a
    # slow/down third-party webhook endpoint can never delay welcome
    # emails or other event handlers — see messenger.yaml's
    # webhook_delivery transport.
    # =========================================================
    webhook-consumer:
        image: ${DOCKER_IMAGE}:${IMAGE_TAG}
        restart: unless-stopped
        command: ["php", "bin/console", "messenger:consume", "webhook_delivery", "--time-limit=3600", "-vv"]
        volumes:
            - ../config/jwt:/app/config/jwt:ro
            - ../config/oauth:/app/config/oauth:ro
        environment:
            APP_ENV: prod
            APP_SECRET: ${APP_SECRET}
            DEFAULT_URI: ${DEFAULT_URI}
            APP_FRONTEND_URL: ${APP_FRONTEND_URL}
            CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
            DATABASE_URL: ${DATABASE_URL}
            RABBITMQ_DSN: ${RABBITMQ_DSN}
            S3_ENDPOINT: ${S3_ENDPOINT}
            S3_ACCESS_KEY: ${S3_ACCESS_KEY}
            S3_SECRET_KEY: ${S3_SECRET_KEY}
            S3_REGION: ${S3_REGION}
            S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
            S3_USE_SSL: ${S3_USE_SSL}
            MAILER_DSN: ${MAILER_DSN}
            MERCURE_URL: ${MERCURE_URL}
            MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL}
            MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
            SENTRY_DSN: ${SENTRY_DSN}
            JWT_SECRET_KEY: ${JWT_SECRET_KEY}
            JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
            JWT_PASSPHRASE: ${JWT_PASSPHRASE}
            OAUTH2_ENCRYPTION_KEY: ${OAUTH2_ENCRYPTION_KEY}
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy

    # =========================================================
    # PostgreSQL — internal only, no host port published. Swap for a
    # managed Postgres (RDS, Cloud SQL, Neon, Supabase, ...) by pointing
    # DATABASE_URL at it and removing this service — see
    # docs/backup-and-restore.md "Production strategy".
    # =========================================================
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5

    # =========================================================
    # RabbitMQ — internal only, no host port published (including the
    # management UI; use an SSH tunnel if you need it: ssh -L
    # 15672:localhost:15672 <host>).
    # =========================================================
    rabbitmq:
        image: rabbitmq:3.13-management-alpine
        restart: unless-stopped
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
            - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
            - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    # =========================================================
    # Redis — cache pool, rate limiter storage, scheduler state, metrics.
    # Internal only, no host port published.
    # =========================================================
    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
    rabbitmq_data:
    redis_data:
    caddy_data:
