# Single-node Garage config for local development / CI.
# Production uses Cloudflare R2 instead (see README "Production: Cloudflare
# R2") — this file is never used outside Docker.
metadata_dir = "/data/meta"
data_dir = "/data/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# Dev-only secret, same trust model as other committed dev defaults (e.g.
# POSTGRES_PASSWORD=change_me in .env). Generate a real one for any
# non-local Garage deployment.
rpc_secret = "179316937f8c4bbe3b22c74f1bed678e0d3b9a652f7c5d55f177e328a081b097"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"
