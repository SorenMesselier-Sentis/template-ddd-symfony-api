services:
    # =========================================================
    # PHP
    # =========================================================
    php:
        build:
            context: .
            dockerfile: php/Dockerfile
        volumes:
            - ../:/app
            # Filename must sort after app.ini/opcache.ini (conf.d loads
            # alphabetically) so display_errors=On actually wins.
            - ./php/php.dev.ini:/usr/local/etc/php/conf.d/zz-app-dev.ini
        environment:
            APP_ENV: ${APP_ENV}
            APP_SECRET: ${APP_SECRET}
            DATABASE_URL: ${DATABASE_URL}
            RABBITMQ_DSN: ${RABBITMQ_DSN}
            PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
            S3_ENDPOINT: ${S3_ENDPOINT}
            S3_ACCESS_KEY: ${S3_ACCESS_KEY}
            S3_SECRET_KEY: ${S3_SECRET_KEY}
            S3_REGION: ${S3_REGION}
            S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
            S3_USE_SSL: ${S3_USE_SSL}
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            garage:
                condition: service_healthy
            redis:
                condition: service_healthy

    # =========================================================
    # Nginx
    # =========================================================
    nginx:
        image: nginx:1.25-alpine
        ports:
            - "${NGINX_PORT}:80"
        volumes:
            - ../:/app
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php

    # =========================================================
    # PostgreSQL
    # =========================================================
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
        ports:
            - "${POSTGRES_PORT}:5432"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    # =========================================================
    # RabbitMQ
    # =========================================================
    rabbitmq:
        image: rabbitmq:3.13-management-alpine
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
            - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
            - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
        ports:
            - "${RABBITMQ_PORT}:5672"
            - "${RABBITMQ_MANAGEMENT_PORT}:15672"
        expose:
            - "15692"
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    # =========================================================
    # Redis (shared cache pool, rate limiter storage, scheduler
    # state and Prometheus metrics)
    # =========================================================
    redis:
        image: redis:7-alpine
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
        volumes:
            - redis_data:/data
        ports:
            - "${REDIS_PORT}:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    # =========================================================
    # PostgreSQL Exporter (optional — monitoring profile only,
    # see "make up-monitoring")
    # =========================================================
    postgres_exporter:
        image: quay.io/prometheuscommunity/postgres-exporter:latest
        profiles: ["monitoring"]
        environment:
            DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
        depends_on:
            postgres:
                condition: service_healthy

    # =========================================================
    # Prometheus (optional — monitoring profile only, see
    # "make up-monitoring")
    # =========================================================
    prometheus:
        image: prom/prometheus:v2.51.0
        profiles: ["monitoring"]
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
            - prometheus_data:/prometheus
        ports:
            - "${PROMETHEUS_PORT}:9090"
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"

    # =========================================================
    # Grafana (optional — monitoring profile only, see
    # "make up-monitoring")
    # =========================================================
    grafana:
        image: grafana/grafana:10.4.0
        profiles: ["monitoring"]
        environment:
            GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
            GF_USERS_ALLOW_SIGN_UP: "false"
        volumes:
            - grafana_data:/var/lib/grafana
            - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
            - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
            - ./grafana/dashboards:/var/lib/grafana/dashboards
        ports:
            - "${GRAFANA_PORT}:3000"
        depends_on:
            - prometheus

    # =========================================================
    # Garage (S3-compatible object storage — local dev/CI only;
    # staging/prod use Cloudflare R2, see
    # docs/rustfs-to-r2-garage-migration.md)
    # =========================================================
    garage:
        image: dxflrs/garage:v2.3.0
        volumes:
            - garage_data:/data
            - ./garage/garage.toml:/etc/garage.toml:ro
        ports:
            - "${S3_API_PORT}:3900"
        healthcheck:
            test: ["CMD", "/garage", "status"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    # =========================================================
    # Mailpit
    # =========================================================
    mailpit:
        image: axllent/mailpit:latest
        ports:
            - "1025:1025" # SMTP
            - "8025:8025" # UI

volumes:
    postgres_data:
    rabbitmq_data:
    prometheus_data:
    grafana_data:
    garage_data:
    redis_data:
