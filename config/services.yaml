parameters:
    metrics_storage_default: apcu
    metrics_redis_host_default: 127.0.0.1
    metrics_redis_port_default: 6379
    metrics_redis_password_default: ''
    app_frontend_url_default: 'http://localhost:8080'
    cors_allowed_origins_default: ''
    otel_exporter_otlp_endpoint_default: ''

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
    _instanceof:
        App\Shared\Domain\Health\HealthCheckInterface:
            tags: ['app.health_check']

    # Autowire src/ folder
    App\:
        resource: "../src/"
        exclude:
            - "../src/*/Domain/ValueObject/"
            - "../src/*/Domain/Exception/"

    # Commands
    App\Shared\Infrastructure\Console\MakeBoundedContextCommand:
        arguments:
            $projectDir: "%kernel.project_dir%"

    App\Shared\Infrastructure\Console\Generator\BoundedContextGenerator:
        arguments:
            $projectDir: "%kernel.project_dir%"

    App\Shared\Infrastructure\Console\Generator\CrudGenerator:
        arguments:
            $projectDir: "%kernel.project_dir%"

    App\Shared\Infrastructure\Console\Generator\CrudRemover:
        arguments:
            $projectDir: "%kernel.project_dir%"

    App\Shared\Infrastructure\Console\Generator\BoundedContextRemover:
        arguments:
            $projectDir: "%kernel.project_dir%"

    App\Shared\Infrastructure\Console\MermaidEntityRelationGeneratorCommand:
        arguments:
            $projectDir: "%kernel.project_dir%"

    # JWT
    App\User\Infrastructure\Service\JwtTokenService:
        arguments:
            $accessTokenTtl: "%env(int:JWT_ACCESS_TOKEN_TTL)%"
            $refreshTokenTtl: "%env(int:JWT_REFRESH_TTL)%"

    App\User\Domain\Service\TokenServiceInterface:
        alias: App\User\Infrastructure\Service\JwtTokenService

    # Contexts
    App\User\Domain\Security\UserContextInterface:
        alias: App\User\Infrastructure\Security\HttpUserContext

    # Normalizers
    App\Shared\Infrastructure\Http\Serializer\ValueObjectNormalizer:
        tags: [serializer.normalizer]
    App\Shared\Infrastructure\Http\Serializer\ResponseNormalizer:
        tags: [serializer.normalizer]

    # API Response
    App\Shared\Infrastructure\Http\Response\ApiResponse:
        arguments:
            $serializer: "@serializer"
            $paginationLinkBuilder: '@App\Shared\Infrastructure\Http\Pagination\PaginationLinkBuilder'

    # Bus implementations
    App\Shared\Infrastructure\Bus\Command\MessengerCommandBus:
        arguments:
            $commandBus: "@command.bus"

    App\Shared\Infrastructure\Bus\Query\MessengerQueryBus:
        arguments:
            $queryBus: "@query.bus"

    App\Shared\Infrastructure\Bus\Event\MessengerEventBus:
        arguments:
            $eventBus: "@event.bus"

    App\Shared\Infrastructure\Messaging\Outbox\OutboxEventBus:
        arguments:
            $connection: "@doctrine.dbal.default_connection"

    App\Shared\Infrastructure\Messaging\Outbox\OutboxRelay:
        arguments:
            $connection: "@doctrine.dbal.default_connection"
            $eventBus: "@event.bus"
            $logger: '@App\Shared\Domain\Logging\LoggerInterface'

    App\Shared\Infrastructure\Messaging\Outbox\OutboxMessagesCleaner:
        arguments:
            $connection: "@doctrine.dbal.default_connection"
            $logger: '@App\Shared\Domain\Logging\LoggerInterface'

    App\Shared\Infrastructure\Health\HealthCheckRegistry:
        arguments:
            $checks: !tagged_iterator app.health_check

    # Scheduler
    App\Shared\Infrastructure\Scheduler\Handler\CleanupStaleOutboxMessagesHandler:
        arguments:
            $retentionDays: "%env(int:OUTBOX_RETENTION_DAYS)%"

    # Logger
    App\Shared\Infrastructure\Logging\MonologLogger:
        arguments:
            $logger: "@logger"
            $requestContext: '@App\Shared\Infrastructure\Http\RequestContext'

    App\Shared\Infrastructure\Logging\RequestIdProcessor:
        tags:
            - { name: monolog.processor }

    App\Shared\Infrastructure\Monitoring\Tracing\TracerInterface:
        factory: ['@App\Shared\Infrastructure\Monitoring\Tracing\TracerFactory', 'create']

    App\Shared\Infrastructure\Monitoring\Tracing\TracerFactory:
        arguments:
            $otlpEndpoint: '%env(default:otel_exporter_otlp_endpoint_default:OTEL_EXPORTER_OTLP_ENDPOINT)%'

    # Domain interfaces → alias to implementations
    App\Shared\Domain\Bus\Event\EventBusInterface:
        alias: App\Shared\Infrastructure\Messaging\Outbox\OutboxEventBus

    App\Shared\Domain\Bus\Command\CommandBusInterface:
        alias: App\Shared\Infrastructure\Bus\Command\MessengerCommandBus

    App\Shared\Domain\Bus\Query\QueryBusInterface:
        alias: App\Shared\Infrastructure\Bus\Query\MessengerQueryBus

    App\Shared\Domain\Logging\LoggerInterface:
        alias: App\Shared\Infrastructure\Logging\MonologLogger

    # Metrics
    App\Shared\Infrastructure\Monitoring\Metrics\PrometheusCollectorRegistryFactory:
        arguments:
            $metricsStorage: "%env(default:metrics_storage_default:METRICS_STORAGE)%"
            $redisHost: "%env(default:metrics_redis_host_default:METRICS_REDIS_HOST)%"
            $redisPort: "%env(int:default:metrics_redis_port_default:METRICS_REDIS_PORT)%"
            $redisPassword: "%env(default:metrics_redis_password_default:METRICS_REDIS_PASSWORD)%"

    App\Shared\Infrastructure\Monitoring\Metrics\BuildInfoMetricsInitializer:
        arguments:
            $appVersion: "%env(default:app_version_default:APP_VERSION)%"
            $appEnv: "%kernel.environment%"

    Prometheus\CollectorRegistry:
        factory: ['@App\Shared\Infrastructure\Monitoring\Metrics\PrometheusCollectorRegistryFactory', 'create']

    App\Shared\Domain\Monitoring\MetricsCollectorInterface:
        alias: App\Shared\Infrastructure\Monitoring\Metrics\PrometheusMetricsCollector

    # Listeners
    App\User\Infrastructure\Http\UserExceptionMapper:
        tags: ['app.exception_mapper']

    App\Document\Infrastructure\Http\DocumentExceptionMapper:
        tags: ['app.exception_mapper']

    App\Shared\Infrastructure\Http\Listener\ExceptionListener:
        arguments:
            $logger: '@App\Shared\Domain\Logging\LoggerInterface'
            $mappers: !tagged_iterator app.exception_mapper
        tags:
            - {
                  name: kernel.event_listener,
                  event: kernel.exception,
                  priority: 100,
              }

    App\Shared\Domain\Security\MessageAuthorizerInterface:
        alias: App\User\Application\Security\UserAuthorizer

    App\Shared\Infrastructure\Http\Listener\ApiHeadersListener:
        arguments:
            $appEnv: '%kernel.environment%'
        tags:
            - { name: kernel.event_listener, event: kernel.response }

    App\Shared\Infrastructure\Http\Listener\RequestCorrelationListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 250 }
            - { name: kernel.event_listener, event: kernel.response }

    App\Shared\Infrastructure\Http\Listener\RequestLogListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 199 }
            - { name: kernel.event_listener, event: kernel.terminate }

    App\Shared\Infrastructure\Http\Listener\ApiRateLimitListener:
        arguments:
            $apiDefaultLimiter: '@limiter.api_default'

    App\Shared\Infrastructure\Http\Listener\CorsListener:
        arguments:
            $allowedOriginsRaw: '%env(default:cors_allowed_origins_default:CORS_ALLOWED_ORIGINS)%'
            $allowedMethods: 'GET, POST, PUT, PATCH, DELETE, OPTIONS'
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 200 }
            - { name: kernel.event_listener, event: kernel.response }

    # Email
    App\Shared\Infrastructure\Email\SymfonyMailerEmailSender:
        arguments:
            $defaultFrom: "%env(MAILER_FROM)%"

    App\Shared\Domain\Email\EmailSenderInterface:
        alias: App\Shared\Infrastructure\Email\SymfonyMailerEmailSender

    App\Shared\Domain\Email\EmailTemplateRendererInterface:
        alias: App\Shared\Infrastructure\Email\TwigEmailTemplateRenderer

    # Notifications
    App\Shared\Infrastructure\Notification\ChannelNotificationSender:
        arguments:
            $handlers:
                - '@App\Shared\Infrastructure\Notification\Handler\EmailChannelNotificationHandler'
                - '@App\Shared\Infrastructure\Notification\Handler\InAppChannelNotificationHandler'

    App\Shared\Domain\Notification\NotificationSenderInterface:
        alias: App\Shared\Infrastructure\Notification\ChannelNotificationSender

    App\User\Infrastructure\EventHandler\SendPasswordResetEmailOnPasswordResetRequested:
        arguments:
            $frontendUrl: '%env(default:app_frontend_url_default:APP_FRONTEND_URL)%'

    App\User\Infrastructure\EventHandler\SendEmailVerificationOnEmailVerificationRequested:
        arguments:
            $frontendUrl: '%env(default:app_frontend_url_default:APP_FRONTEND_URL)%'

    App\User\Infrastructure\Security\AuthRateLimitListener:
        arguments:
            $authLoginLimiter: '@limiter.auth_login'
            $authForgotPasswordLimiter: '@limiter.auth_forgot_password'
            $authRegisterLimiter: '@limiter.auth_register'
            $environment: '%kernel.environment%'

    # Repositories
    App\User\Domain\Repository\UserRepositoryInterface:
        alias: App\User\Infrastructure\Persistence\Doctrine\Repository\DoctrineUserRepository

    App\User\Domain\Repository\RefreshTokenRepositoryInterface:
        alias: App\User\Infrastructure\Persistence\Doctrine\Repository\DoctrineRefreshTokenRepository

    App\User\Domain\Repository\PasswordResetTokenRepositoryInterface:
        alias: App\User\Infrastructure\Persistence\Doctrine\Repository\DoctrinePasswordResetTokenRepository

    App\User\Domain\Repository\EmailVerificationTokenRepositoryInterface:
        alias: App\User\Infrastructure\Persistence\Doctrine\Repository\DoctrineEmailVerificationTokenRepository

    # Document storage
    App\Document\Infrastructure\Storage\S3DocumentStorageAdapter:
        arguments:
            $endpoint: '%env(S3_ENDPOINT)%'
            $accessKey: '%env(S3_ACCESS_KEY)%'
            $secretKey: '%env(S3_SECRET_KEY)%'
            $useSsl: '%env(bool:S3_USE_SSL)%'

    App\Document\Infrastructure\Storage\S3BucketExistenceChecker:
        arguments:
            $endpoint: '%env(S3_ENDPOINT)%'
            $accessKey: '%env(S3_ACCESS_KEY)%'
            $secretKey: '%env(S3_SECRET_KEY)%'
            $useSsl: '%env(bool:S3_USE_SSL)%'

    App\Document\Infrastructure\Storage\S3BucketManager:
        arguments:
            $endpoint: '%env(S3_ENDPOINT)%'
            $accessKey: '%env(S3_ACCESS_KEY)%'
            $secretKey: '%env(S3_SECRET_KEY)%'
            $useSsl: '%env(bool:S3_USE_SSL)%'

    App\Document\Application\Service\BucketMimeTypeValidator:
        arguments:
            $buckets: '%document_storage.buckets%'

    App\Document\Application\Command\UploadDocument\UploadDocumentCommandHandler:
        arguments:
            $auditBus: '@audit.bus'
            $maxSinglePartBytes: '%document_storage.max_single_part_bytes%'

    App\Document\Application\Command\MultipartUpload\InitiateMultipartUploadCommandHandler:
        arguments:
            $minMultipartBytes: '%document_storage.min_multipart_bytes%'
            $maxMultipartBytes: '%document_storage.max_multipart_bytes%'

    App\Document\Application\Service\MultipartPartSizeValidator:
        arguments:
            $minPartBytes: '%document_storage.min_part_bytes%'

    App\Document\Application\Service\PresignedUrlTtlValidator:
        arguments:
            $minTtlSeconds: '%document_storage.presigned_url_min_ttl%'
            $maxTtlSeconds: '%document_storage.presigned_url_max_ttl%'

    App\Document\Application\Query\GetDocumentPresignedUrl\GetDocumentPresignedUrlQueryHandler:
        arguments:
            $defaultTtlSeconds: '%env(int:S3_PRESIGNED_URL_TTL)%'

    App\Document\Domain\Storage\DocumentStorageInterface:
        alias: App\Document\Infrastructure\Storage\S3DocumentStorageAdapter

    App\Document\Domain\Storage\MultipartDocumentStorageInterface:
        alias: App\Document\Infrastructure\Storage\S3DocumentStorageAdapter

    App\Document\Domain\Storage\DocumentPresignedUrlGeneratorInterface:
        alias: App\Document\Infrastructure\Storage\S3DocumentStorageAdapter

    App\Document\Domain\Storage\BucketExistenceCheckerInterface:
        alias: App\Document\Infrastructure\Storage\S3BucketExistenceChecker

    App\Document\Domain\Storage\BucketManagerInterface:
        alias: App\Document\Infrastructure\Storage\S3BucketManager

    App\Document\Domain\Repository\DocumentRepositoryInterface:
        alias: App\Document\Infrastructure\Persistence\Doctrine\Repository\DoctrineDocumentRepository

    App\Document\Domain\Repository\MultipartUploadSessionRepositoryInterface:
        alias: App\Document\Infrastructure\Persistence\Doctrine\Repository\DoctrineMultipartUploadSessionRepository

    App\Document\Domain\Security\OwnerContextInterface:
        alias: App\Document\Infrastructure\Security\HttpOwnerContext
