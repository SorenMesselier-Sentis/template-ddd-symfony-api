framework:
    messenger:
        default_bus: command.bus
        failure_transport: async.dead_letter
        buses:
            command.bus:
                middleware:
                    - App\Shared\Infrastructure\Monitoring\Metrics\BusMetricsMiddleware
                    - App\Shared\Infrastructure\Monitoring\Tracing\TracerMiddleware
                    - App\Shared\Infrastructure\Messaging\AuthorizeMessageMiddleware
                    - App\Shared\Infrastructure\Messaging\FeatureFlagMessageMiddleware
                    - App\Shared\Infrastructure\Messaging\AuditMessageMiddleware
                    - doctrine_transaction
            query.bus:
                middleware:
                    - App\Shared\Infrastructure\Monitoring\Metrics\BusMetricsMiddleware
                    - App\Shared\Infrastructure\Monitoring\Tracing\TracerMiddleware
                    - App\Shared\Infrastructure\Messaging\AuthorizeMessageMiddleware
                    - App\Shared\Infrastructure\Messaging\FeatureFlagMessageMiddleware
            audit.bus:
                middleware:
                    - App\Shared\Infrastructure\Monitoring\Metrics\BusMetricsMiddleware
                    - App\Shared\Infrastructure\Monitoring\Tracing\TracerMiddleware
            event.bus:
                default_middleware: allow_no_handlers
                middleware:
                    - App\Shared\Infrastructure\Monitoring\Metrics\BusMetricsMiddleware
                    - App\Shared\Infrastructure\Monitoring\Tracing\TracerMiddleware

        transports:
            sync: 'sync://'

            async:
                dsn: '%env(RABBITMQ_DSN)%'
                options:
                    exchange:
                        name: events
                        type: topic
                    queues:
                        events.user:
                            binding_keys: ['user.#']
                        events.task:
                            binding_keys: ['task.#']
                        events.project:
                            binding_keys: ['project.#']
                        events.document:
                            binding_keys: ['document.#']
                        events.api_client:
                            binding_keys: ['api_client.#']
                        events.webhook_subscription:
                            binding_keys: ['webhook_subscription.#']
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2

            # Outbound webhook HTTP delivery — deliberately its own transport/queue, consumed by
            # its own worker (make webhook-consumer), not shared with `async`: a slow/down third
            # party must never block welcome emails or other event handlers. More tolerant retry
            # budget than `async` since a delivery failure here is the expected case, not a bug.
            # Point-to-point (direct exchange), not pub/sub — DeliverWebhookCommand is a job for
            # one specific subscription, never something another consumer also cares about.
            webhook_delivery:
                dsn: '%env(RABBITMQ_DSN)%'
                options:
                    exchange:
                        name: webhook_delivery
                        type: direct
                    queues:
                        webhook_delivery: ~
                retry_strategy:
                    max_retries: 5
                    delay: 2000
                    multiplier: 2

            async.dead_letter:
                dsn: '%env(RABBITMQ_DSN)%'
                options:
                    exchange:
                        name: dead_letter
                        type: direct
                    queues:
                        dead_letter: ~
                retry_strategy:
                    max_retries: 0

        routing:
            'App\Shared\Domain\Bus\Command\Command': sync
            'App\Document\Application\Command\UploadDocument\RecordDocumentUploadFailureCommand': sync
            'App\Webhook\Application\Command\DeliverWebhook\DeliverWebhookCommand': webhook_delivery
            'App\Shared\Domain\Bus\Query\Query': sync
            'App\Shared\Domain\Bus\Event\DomainEvent': async
            'App\Shared\Infrastructure\Messaging\RabbitMQ\DeadLetterMessage': async.dead_letter
