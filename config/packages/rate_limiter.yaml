framework:
    rate_limiter:
        auth_login:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        auth_forgot_password:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        auth_register:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        oauth_token:
            policy: sliding_window
            limit: 10
            interval: '1 minute'
        # Blanket ceiling applied to every /api/v1 request (health, metrics and
        # docs are excluded), on top of the tighter per-endpoint auth limiters
        # above. Keyed by authenticated user id, falling back to client IP.
        api_default:
            policy: sliding_window
            limit: 300
            interval: '1 minute'

when@test:
    framework:
        rate_limiter:
            auth_login:
                policy: no_limit
            auth_forgot_password:
                policy: no_limit
            auth_register:
                policy: no_limit
            oauth_token:
                policy: no_limit
            api_default:
                policy: no_limit
