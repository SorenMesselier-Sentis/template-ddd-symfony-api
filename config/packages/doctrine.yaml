doctrine:
    dbal:
        driver: pdo_pgsql
        url: "%env(resolve:DATABASE_URL)%"
        types:
            user_id: App\User\Infrastructure\Persistence\Doctrine\Type\UserIdType
            email: App\Shared\Infrastructure\Persistence\Doctrine\Type\EmailType
            user_name: App\User\Infrastructure\Persistence\Doctrine\Type\UserNameType
            hashed_password: App\User\Infrastructure\Persistence\Doctrine\Type\HashedPasswordType
            user_status: App\User\Infrastructure\Persistence\Doctrine\Type\UserStatusType
            user_roles: App\User\Infrastructure\Persistence\Doctrine\Type\UserRolesType
            refresh_token_id: App\User\Infrastructure\Persistence\Doctrine\Type\RefreshTokenIdType
            password_reset_token_id: App\User\Infrastructure\Persistence\Doctrine\Type\PasswordResetTokenIdType
            email_verification_token_id: App\User\Infrastructure\Persistence\Doctrine\Type\EmailVerificationTokenIdType
            document_id: App\Document\Infrastructure\Persistence\Doctrine\Type\DocumentIdType
            owner_id: App\Document\Infrastructure\Persistence\Doctrine\Type\OwnerIdType
            bucket_name: App\Document\Infrastructure\Persistence\Doctrine\Type\BucketNameType
            object_path: App\Document\Infrastructure\Persistence\Doctrine\Type\ObjectPathType
            document_mime_type: App\Document\Infrastructure\Persistence\Doctrine\Type\MimeTypeType
            document_status: App\Document\Infrastructure\Persistence\Doctrine\Type\DocumentStatusType
            multipart_upload_status: App\Document\Infrastructure\Persistence\Doctrine\Type\MultipartUploadStatusType
            project_id: App\Project\Infrastructure\Persistence\Doctrine\Type\ProjectIdType
            task_id: App\Project\Infrastructure\Persistence\Doctrine\Type\TaskIdType
            project_owner_id: App\Project\Infrastructure\Persistence\Doctrine\Type\OwnerIdType
            project_assignee_id: App\Project\Infrastructure\Persistence\Doctrine\Type\AssigneeIdType
            project_attachment_id: App\Project\Infrastructure\Persistence\Doctrine\Type\AttachmentIdType
            project_name: App\Project\Infrastructure\Persistence\Doctrine\Type\ProjectNameType
            task_title: App\Project\Infrastructure\Persistence\Doctrine\Type\TaskTitleType
            project_status: App\Project\Infrastructure\Persistence\Doctrine\Type\ProjectStatusType
            task_status: App\Project\Infrastructure\Persistence\Doctrine\Type\TaskStatusType
            api_client_id: App\ApiClient\Infrastructure\Persistence\Doctrine\Type\ApiClientIdType
            hashed_client_secret: App\ApiClient\Infrastructure\Persistence\Doctrine\Type\HashedClientSecretType
            api_client_status: App\ApiClient\Infrastructure\Persistence\Doctrine\Type\ApiClientStatusType
            api_client_scopes: App\ApiClient\Infrastructure\Persistence\Doctrine\Type\ApiClientScopesType
            webhook_subscription_id: App\Webhook\Infrastructure\Persistence\Doctrine\Type\WebhookSubscriptionIdType
            webhook_url: App\Webhook\Infrastructure\Persistence\Doctrine\Type\WebhookUrlType
            webhook_subscription_status: App\Webhook\Infrastructure\Persistence\Doctrine\Type\WebhookSubscriptionStatusType
            webhook_event_names: App\Webhook\Infrastructure\Persistence\Doctrine\Type\WebhookEventNamesType
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
            User:
                type: xml
                dir: "%kernel.project_dir%/src/User/Infrastructure/Persistence/Doctrine/Mapping"
                prefix: App\User\Domain\Entity
                is_bundle: false
            refreshToken:
                type: xml
                dir: "%kernel.project_dir%/src/User/Infrastructure/Persistence/Doctrine/Mapping"
                prefix: App\User\Domain\Entity
                is_bundle: false
            passwordResetToken:
                type: xml
                dir: "%kernel.project_dir%/src/User/Infrastructure/Persistence/Doctrine/Mapping"
                prefix: App\User\Domain\Entity
                is_bundle: false
            emailVerificationToken:
                type: xml
                dir: "%kernel.project_dir%/src/User/Infrastructure/Persistence/Doctrine/Mapping"
                prefix: App\User\Domain\Entity
                is_bundle: false
            Document:
                type: xml
                dir: "%kernel.project_dir%/src/Document/Infrastructure/Persistence/Doctrine/Mapping"
                prefix: App\Document\Domain\Entity
                is_bundle: false
            Project:
                type: xml
                dir: "%kernel.project_dir%/src/Project/Infrastructure/Persistence/Doctrine/Mapping"
                prefix: App\Project\Domain\Entity
                is_bundle: false
            ApiClient:
                type: xml
                dir: "%kernel.project_dir%/src/ApiClient/Infrastructure/Persistence/Doctrine/Mapping"
                prefix: App\ApiClient\Domain\Entity
                is_bundle: false
            Webhook:
                type: xml
                dir: "%kernel.project_dir%/src/Webhook/Infrastructure/Persistence/Doctrine/Mapping"
                prefix: App\Webhook\Domain\Entity
                is_bundle: false
when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
