framework:
    cache:
        # Shared across every "php" replica — required for correctness once the
        # service is scaled to more than one instance, since cache.app also
        # backs the rate limiter storage (cache.rate_limiter inherits from it)
        # and the scheduler's missed-run state tracking (DefaultSchedule).
        # A filesystem/APCu pool here would silently give each replica its own
        # rate-limit counters and schedule state.
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_DSN)%'

        # Namespaced pools use the above "app" backend by default
        #pools:
            #my.dedicated.cache: null

when@test:
    framework:
        cache:
            app: cache.adapter.filesystem
